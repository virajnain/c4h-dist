spack:
  specs:
    - root+geom+math
    - dd4hep
    - edm4hep
    - podio
    - geant4
    - stitched
    - k4geo
    - lcio
    - boost +program_options
    - py-pybind11
    - catch2

  concretizer:
    unify: true

  packages:
    all:
      prefer:
        - "*%gcc@14"
    gcc:
      require:
        - "*%gcc@11.5.0"
    py-hatchling:
      require:
        - "@1.29.0"
    py-trove-classifiers:
      require:
        - "@2026.6.1.19"
    dd4hep:
      require:
        - "*+ddg4"
        - "*+xercesc"
    geant4:
      require:
        - "@11:"