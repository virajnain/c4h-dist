spack:
  repos:
  - /opt/c4h-spack-packages/spack_repo/code4hep
  specs:
  - code4hep@main ^root@6.36
  concretizer:
    unify: true

  packages:
    all:
      target: [x86_64_v3]
      prefer:
        - "*%gcc@14"
      variants: cxxstd=20
    gcc:
      require:
        - "*%gcc@11.5.0"
    py-hatchling:
      require:
        - "@1.29.0"
    py-trove-classifiers:
      require:
        - "@2026.6.1.19"
    edm4hep:
      require:
        - "@1.0:"
    dd4hep:
      require:
        - "*+ddg4"
    geant4:
      require:
        - "@11.5.0.beta +threads +data"
    podio:
      require:
        - "@1.7"