name: Fill build cache
on:
  workflow_dispatch:
    inputs:
      c4h_spack_packages_ref: {default: main}
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions: {contents: read, packages: write, actions: write}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Build the base image locally
        run: docker build -f Dockerfile.base -t c4h-base-local .
      - name: Compile and push to the cache
        id: build
        run: |
          set +e
          docker run --rm -v "$PWD":/work -w /work \
            -e GHCR_USER=${{ github.actor }} -e GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e CACHE_URL=oci://ghcr.io/${{ github.repository_owner }}/c4h-buildcache \
            -e PKGS_REPO=https://github.com/${{ github.repository_owner }}/c4h-spack-packages.git \
            -e PKGS_REF=${{ inputs.c4h_spack_packages_ref || 'main' }} \
            c4h-base-local bash scripts/fill-cache.sh
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Continue if out of time
        if: steps.build.outputs.code == '124'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run fill-cache.yaml -f c4h_spack_packages_ref=${{ inputs.c4h_spack_packages_ref || 'main' }}
      - name: Fail on real errors
        if: steps.build.outputs.code != '0' && steps.build.outputs.code != '124'
        run: exit 1