name: Build Code4hep

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      c4h_spack_packages_ref:
        description: c4h-spack-packages branch or tag to build the image against
        default: main

jobs:
#  pre-commit:
#    name: Code format & static checks
#    runs-on: ubuntu-latest
#    steps:
#      - uses: actions/checkout@v4
#      - uses: actions/setup-python@v5
#        with:
#          python-version: "3.12"
#      - uses: pre-commit/action@v3.0.1

  changes:
    name: Do the image inputs need a rebuild?
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.check.outputs.base }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "base=true" >> "$GITHUB_OUTPUT"; echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "base=false" >> "$GITHUB_OUTPUT"; echo "image=false" >> "$GITHUB_OUTPUT"
          fi
  base:
    name: Build and push base image
    needs: changes
    if: needs.changes.outputs.base == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ghcr.io/virajnain/c4h-base:latest
  image:
    name: Build and push container
    needs: [changes, base]
    if: ${{ !cancelled() && needs.changes.outputs.image == 'true' && (needs.base.result == 'success' || needs.base.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            C4H_SPACK_PACKAGES_REF=${{ inputs.c4h_spack_packages_ref || 'main' }}
            SPACK_JOBS=4
            BASE_IMAGE=ghcr.io/virajnain/c4h-base:latest
          tags: ghcr.io/virajnain/code4hep-ci:${{ steps.meta.outputs.tag }}
      - name: Refuse non-portable images
        run: |
          docker run --rm ghcr.io/virajnain/code4hep-ci:${{ steps.meta.outputs.tag }} bash -c '
            source /opt/spack/share/spack/setup-env.sh
            archs=$(spack find -v | grep -o "arch=[^ ]*" | sort -u)
            echo "$archs"
            [ -n "$archs" ] && ! echo "$archs" | grep -qE "x86_64_v4|skylake_avx512|cascadelake|cooperlake|icelake|sapphirerapids|knl|knm|zen4|zen5"'
      - name: Add newly built packages to the build cache
        run: |
          docker run --rm -e GHCR_USER=${{ github.actor }} -e GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            ghcr.io/virajnain/code4hep-ci:${{ steps.meta.outputs.tag }} bash -c '
              source /opt/spack/share/spack/setup-env.sh
              spack mirror add --unsigned --oci-username "$GHCR_USER" \
                --oci-password-variable GHCR_TOKEN c4h-push oci://ghcr.io/virajnain/c4h-buildcache
              spack buildcache push --unsigned --update-index c4h-push $(spack find --format "/{hash}")'
      - name: Push the image
        run: |
          docker tag ghcr.io/virajnain/code4hep-ci:${{ steps.meta.outputs.tag }} ghcr.io/virajnain/code4hep-ci:latest
          docker push ghcr.io/virajnain/code4hep-ci:${{ steps.meta.outputs.tag }}
          docker push ghcr.io/virajnain/code4hep-ci:latest

  build:
    name: Build and Test Code4hep
    needs: [changes, base, image]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.base.result) && contains(fromJSON('["success","skipped"]'), needs.image.result) }}
    runs-on: ubuntu-latest
    container:
      # the image built in this run if there was one, otherwise the latest published
      image: ghcr.io/virajnain/code4hep-ci:${{ needs.image.outputs.tag || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Show runner CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -q avx512f /proc/cpuinfo && echo "AVX-512: yes" || echo "AVX-512: NO"
      - name: Show package architectures in the image
        run: |
          source /opt/spack/share/spack/setup-env.sh
          spack env activate code4hep_env
          spack find -v | grep -oE 'arch=[^ ]+' | sort | uniq -c
      - name: Build Code4hep with Spack
        run: |
          source /opt/spack/share/spack/setup-env.sh
          spack repo add /opt/c4h-spack-packages/spack_repo/code4hep || true
          spack env activate code4hep_env
          spack uninstall -y code4hep || true
          spack concretize -f
          spack install --fail-fast --show-log-on-error -j$(nproc) --keep-stage --add code4hep
      - name: Check that Code4hep was installed
        run: |
          source /opt/spack/share/spack/setup-env.sh
          spack env activate code4hep_env
          spack find -v code4hep
