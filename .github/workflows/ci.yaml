  build:
    name: Build Code4hep
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/virajnain/code4hep-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Code4hep
        run: |
          source /opt/spack/share/spack/setup-env.sh
          spack env activate code4hep_env
          cd /scratch/build
          ./setup.sh
