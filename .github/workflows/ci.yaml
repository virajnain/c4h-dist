  build:
    name: Build Code4hep
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/virajnain/code4hep-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Spack Tests
        run: |
          source /opt/spack/share/spack/setup-env.sh
          spack env activate code4hep_env
          spack repo list
          spack find -cv edm4hep root podio stitched
      - name: Build Code4hep
        run: |
          source /opt/spack/share/spack/setup-env.sh
          spack env activate code4hep_env
          cd /scratch/build
          ./setup.sh
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/virajnain/code4hep-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Code4hep
        run: |
          source /opt/spack/share/spack/setup-env.sh
          spack env activate code4hep_env
          cd /scratch/build
          ./setup.sh
          cd /scratch/tmp/Code4hep/build_Code4hep
          ctest --output-on-failure
